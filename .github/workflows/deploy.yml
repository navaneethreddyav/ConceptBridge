# ConceptBridge deploy workflow — Cloudflare Workers (API) + Cloudflare Pages (frontend).
#
# Same-origin architecture: the browser only ever talks to the Pages origin
# (conceptbridge-cbv.pages.dev). frontend/functions/api/[[path]].js proxies /api/* to
# the conceptbridge-api Worker over a service binding declared in
# frontend/wrangler.jsonc — not a public fetch — so the frontend build below
# deliberately does NOT set VITE_API_BASE_URL; it falls back to '' (relative paths),
# which resolve to that same-origin proxy. See frontend/src/config/api.js and
# backend/src/middleware/userIdentity.js for why this matters: the anonymous identity
# cookie needs to be same-site to persist in every browser, Safari/WebKit included.
#
# REQUIRED SETUP BEFORE THIS WORKFLOW WILL SUCCEED:
#
# Repo secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   - CLOUDFLARE_API_TOKEN   Cloudflare API token with Workers + Pages deploy permissions.
#   - CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID.
#
# KNOWN LIMITATION (Cloudflare-side, not a workflow bug): as of this writing, the
# "Deploy Worker API" step below fails with Cloudflare API error 7003
# ("Could not route to /accounts/{id}/workers/services/{name}") on every API-token
# type tried (multiple User API Tokens, an Account API Token, different permission
# scopes) despite the exact same account/Worker/route working correctly via OAuth
# login and via a direct, token-authenticated curl call to the same endpoint outside
# wrangler. This has been narrowed down to Cloudflare's own account-side handling of
# that specific legacy endpoint for this account, not anything fixable from this
# workflow or repository. Until Cloudflare resolves it, deploys are done directly via
# `wrangler deploy` / `wrangler pages deploy` using an authenticated `wrangler login`
# session rather than through this workflow.

name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Deploy Worker API
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=conceptbridge
